name: Windows Build

on:
  push:
    branches:
      - dev
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/workflows/changelog.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    env:
      REPO_NAME: tdesktop
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win-x64.md"
          SDK="$(grep -oP '\d+\.\d+\.\d+\.\d+' "$DOCPATH" | head -1)"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Strip /Zi from default debug flags so library builds do not produce
          # tens of GB of PDBs and exhaust runner disk space.
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' \
            "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@ayugram.local"
          git config --global user.name "AyuGram CI"

      - name: Apply lib_ui patches.
        shell: bash
        run: |
          set -e
          cd "$TBUILD/$REPO_NAME"
          if [ -x Telegram/patches/apply_patches.sh ]; then
            bash Telegram/patches/apply_patches.sh
          elif [ -f Telegram/patches/apply_patches.sh ]; then
            bash Telegram/patches/apply_patches.sh
          fi

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Setup Python.
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Ninja.
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>nul
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Free up some disk space.
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files\dotnet",
            "C:\Android",
            "C:\hostedtoolcache\windows\Java_*",
            "C:\Program Files (x86)\Android",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\Program Files\Unity Hub"
          )
          foreach ($p in $paths) {
            Get-Item $p -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $_.FullName
            }
          }

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        timeout-minutes: 180
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Trim Libraries (drop intermediates).
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete 2>/dev/null || true

      - name: Configure.
        run: |
          if not exist %TBUILD%\%REPO_NAME%\out mkdir %TBUILD%\%REPO_NAME%\out
          cd %TBUILD%\%REPO_NAME%\out
          cmake -G "Ninja Multi-Config" ^
            -DCMAKE_CONFIGURATION_TYPES=Debug ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -DTDESKTOP_API_ID=2040 ^
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            ..

      - name: Build.
        run: |
          cmake --build %TBUILD%\%REPO_NAME%\out --config Debug --parallel

      - name: Collect artifacts.
        run: |
          mkdir %TBUILD%\artifact
          move %TBUILD%\%REPO_NAME%\out\Debug\Telegram.exe %TBUILD%\artifact\AyuGram.exe
          if exist %TBUILD%\%REPO_NAME%\out\Debug\Updater.exe (
            move %TBUILD%\%REPO_NAME%\out\Debug\Updater.exe %TBUILD%\artifact\Updater.exe
          )

      - name: Upload artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Debug
          path: ${{ env.TBUILD }}\artifact\
