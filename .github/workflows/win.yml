name: Windows Build

on:
  push:
    branches:
      - dev
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - '.github/workflows/changelog.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    env:
      TBUILD: "D:\\TBuild"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute cache keys
        id: cache-keys
        shell: bash
        run: |
          echo "libs=$(sha256sum Telegram/build/prepare/prepare.py | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Prepare build directories
        shell: cmd
        run: |
          mkdir %TBUILD%
          mkdir %TBUILD%\ThirdParty
          mkdir %TBUILD%\Libraries
          mklink /J %TBUILD%\tdesktop "%CD%"

      - name: Apply lib_ui patches
        shell: bash
        run: |
          if [ -f Telegram/patches/apply_patches.sh ]; then
            bash Telegram/patches/apply_patches.sh
          fi

      - name: Extract SDK version
        id: sdk
        shell: bash
        run: |
          echo "version=$(grep -oP '\d+\.\d+\.\d+\.\d+' docs/building-win-x64.md | head -1)" >> $GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          sdk: ${{ steps.sdk.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup NuGet
        shell: cmd
        run: |
          nuget sources add -Name aspect -Source https://pkgs.dev.azure.com/aspect-build/aspect/_packaging/aspect/nuget/v3/index.json 2>nul
          exit /b 0

      - name: Cache Libraries
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}/Libraries
          key: win-x64-libs-v2-${{ steps.cache-keys.outputs.libs }}
          restore-keys: |
            win-x64-libs-v2-

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: win-x64-thirdparty-v2
          restore-keys: |
            win-x64-thirdparty-

      - name: Free disk space
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\dotnet") { Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue }
          if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue }

      - name: Prepare libraries
        shell: cmd
        timeout-minutes: 120
        run: |
          cd %TBUILD%
          tdesktop\Telegram\build\prepare\win.bat skip-release silent

      - name: Configure (Ninja)
        shell: cmd
        run: |
          if not exist %TBUILD%\tdesktop\out mkdir %TBUILD%\tdesktop\out
          cd %TBUILD%\tdesktop\out
          cmake -G "Ninja Multi-Config" ^
            -DCMAKE_CONFIGURATION_TYPES=Debug ^
            -DTDESKTOP_API_ID=2040 ^
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -Werror=dev -Werror=deprecated --warn-uninitialized ^
            ..

      - name: Build
        shell: cmd
        run: |
          cmake --build %TBUILD%\tdesktop\out --config Debug --parallel

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir %TBUILD%\artifact
          copy %TBUILD%\tdesktop\out\Debug\Telegram.exe %TBUILD%\artifact\AyuGram.exe
          if exist %TBUILD%\tdesktop\out\Debug\Updater.exe (
            copy %TBUILD%\tdesktop\out\Debug\Updater.exe %TBUILD%\artifact\Updater.exe
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Debug
          path: ${{ env.TBUILD }}/artifact/
