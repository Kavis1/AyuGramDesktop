name: Windows Build

on:
  push:
    branches:
      - dev
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - '.github/workflows/changelog.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    env:
      TBUILD: "D:\\TBuild"

    steps:
      - name: Prepare build directories
        shell: cmd
        run: |
          mkdir %TBUILD%
          mkdir %TBUILD%\ThirdParty
          mkdir %TBUILD%\Libraries

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Move repo to build path
        shell: cmd
        run: |
          move tdesktop %TBUILD%\tdesktop

      - name: Apply lib_ui patches
        shell: bash
        run: |
          cd "$TBUILD/tdesktop"
          if [ -f Telegram/patches/apply_patches.sh ]; then
            bash Telegram/patches/apply_patches.sh
          fi

      - name: Extract SDK version
        id: sdk
        shell: bash
        run: |
          echo "version=$(grep -oP '\d+\.\d+\.\d+\.\d+' $TBUILD/tdesktop/docs/building-win-x64.md | head -1)" >> $GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          sdk: ${{ steps.sdk.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup NuGet
        shell: cmd
        run: |
          nuget sources add -Name aspect -Source https://pkgs.dev.azure.com/aspect-build/aspect/_packaging/aspect/nuget/v3/index.json 2>nul || echo ok

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: win-x64-thirdparty-${{ hashFiles('tdesktop/.gitmodules') }}

      - name: Cache Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}/Libraries
          key: win-x64-libraries-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}

      - name: Prepare libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd %TBUILD%
          tdesktop\Telegram\build\prepare\win.bat skip-release silent

      - name: Configure
        shell: cmd
        run: |
          cd %TBUILD%\tdesktop\Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build %TBUILD%\tdesktop\out --config Debug --parallel --target Telegram

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir %TBUILD%\artifact
          copy %TBUILD%\tdesktop\out\Debug\Telegram.exe %TBUILD%\artifact\AyuGram.exe
          if exist %TBUILD%\tdesktop\out\Debug\Updater.exe (
            copy %TBUILD%\tdesktop\out\Debug\Updater.exe %TBUILD%\artifact\Updater.exe
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Debug
          path: ${{ env.TBUILD }}/artifact/
